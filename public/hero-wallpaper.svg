<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" role="img" aria-label="Paisaje abstracto en tonos malva, rosa y gris">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27232a"/>
      <stop offset=".45" stop-color="#765a68"/>
      <stop offset="1" stop-color="#23272b"/>
    </linearGradient>
    <radialGradient id="glow" cx="55%" cy="30%" r="55%">
      <stop offset="0" stop-color="#d4a1ad" stop-opacity=".72"/>
      <stop offset=".48" stop-color="#9d7583" stop-opacity=".25"/>
      <stop offset="1" stop-color="#232329" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#6b6068"/>
      <stop offset="1" stop-color="#29272b"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .075"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1920" height="1200" fill="url(#sky)"/>
  <rect width="1920" height="1200" fill="url(#glow)"/>
  <ellipse cx="1060" cy="330" rx="620" ry="230" fill="#d6a3ae" opacity=".2" filter="url(#soft)"/>
  <path d="M0 810 240 620l230 128 300-330 250 270 250-178 270 248 380-214v656H0Z" fill="url(#ridge)" opacity=".86"/>
  <path d="M0 940 280 742l240 180 330-246 260 180 335-246 475 286v304H0Z" fill="#242429" opacity=".86"/>
  <path d="M0 1030c290-135 498-68 730-8 265 69 524 84 1190-126v304H0Z" fill="#16181b" opacity=".82"/>
  <rect width="1920" height="1200" filter="url(#grain)" opacity=".65"/>
</svg>
